name: Fabric build and package checks

on:
  push:
    branches-ignore: ['coordination/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_COMMIT_REF_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test package and work-claim guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Compile Fabric and execute automated tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          bash ./gradlew :common:compileKotlin :common:compileJava :common:test :fabric:build --stacktrace --console=plain 2>&1 | tee ci-logs/build.log
      - name: Validate installable package structure
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(fabric/build/libs/cobblemon-*-mc26.3-*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo 'Expected exactly one custom Fabric release candidate JAR' >&2
            exit 1
          fi
          python3 scripts/validate_jar.py "${jars[0]}" --output-dir dist | tee ci-logs/package-validation.log
      - name: Upload compiled package after structural checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cobblemon-fabric-mc26.3-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fabric-diagnostics-${{ github.sha }}
          path: |
            ci-logs/
            common/build/reports/tests/
            common/build/test-results/
            fabric/build/reports/tests/
            fabric/build/test-results/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 30
